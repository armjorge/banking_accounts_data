name: sql

on:
  pull_request:
    paths:
      - "sql/**"
      - ".sqlfluff"
      - "scripts/apply_public_ddl.py"
      - ".github/workflows/sql.yml"
  push:
    paths:
      - "sql/**"
      - ".sqlfluff"
      - "scripts/apply_public_ddl.py"
      - ".github/workflows/sql.yml"

permissions:
  contents: read

concurrency:
  group: sql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlfluff:
    name: sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLFluff
        run: pip install "sqlfluff==4.1.0"
      - name: Lint sql
        run: sqlfluff lint sql

  apply-ddl:
    name: apply ddl
    needs: sqlfluff
    if: >-
      startsWith(github.base_ref, 'releases/')
      || startsWith(github.ref, 'refs/heads/releases/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: uv sync --frozen
      - name: Apply neondb.public DDL
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: uv run python scripts/apply_public_ddl.py
